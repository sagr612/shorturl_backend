spring.application.name=shortUrl

## App Config
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.default-expiry-in-days=30
app.validate-original-url=true
app.page-size=10

## DATABASE
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

## Flyway
# Custom location (not the default classpath:db/migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

## JPA
# 'validate' = Hibernate checks entities match the DB schema but NEVER alters it.
# Flyway owns all schema changes from now on.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

## Hikari
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10

## JWT
jwt.secret=${JWT_SECRET}
jwt.expirationMs=${JWT_EXPTIME:86400000}

## Actuator
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ADMIN


## Redis
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.ssl.enabled=true

## Logging
logging.level.org.springframework.cache=TRACE

