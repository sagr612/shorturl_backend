# Disable Flyway migrations during tests
spring.flyway.enabled=false

# In-memory H2 so context loads without real Postgres
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Avoid real Redis connection
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.ssl.enabled=false

# Dummy values so @ConfigurationProperties / @Value passes
app.frontend.url=http://localhost:5173
app.validate-original-url=false
app.default-expiry-in-days=30
JWT_SECRET=test-jwt-secret-that-is-long-enough-for-hs256-algorithm
